name: "dom-extractor"
description: "Extracts structured text, extracts HTML attributes, and evaluates CSS/XPath queries on live pages."
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Natural language extraction goal or structured extraction query."
    selector:
      type: string
      description: "Optional CSS selector or XPath pattern to isolate target DOM sub-trees."
    extract_links:
      type: boolean
      description: "Whether to include resolved hyperlink targets in extraction results."
      default: false
  required:
    - query
